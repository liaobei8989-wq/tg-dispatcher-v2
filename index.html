<!doctype html>
<html lang="zh-CN" class="notranslate" translate="no" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram 矩阵极速全自动化营销中台</title>
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 1. Auto handle Vite chunk reload upon deployment updates
      window.addEventListener('vite:preloadError', function () {
        console.warn('Vite preload error detected, auto-reloading...');
        window.location.reload();
      });
      // 2. Global error watchdog for asset / chunk loading failure
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('Failed to fetch module') !== -1 || msg.indexOf('MIME type') !== -1) {
          console.warn('Chunk script loading issue detected:', msg);
          setTimeout(function () {
            window.location.reload();
          }, 500);
        }
      });
      // 3. Reveal recovery reload button if mount takes longer than 3 seconds
      setTimeout(function () {
        var btn = document.getElementById('loading-fallback-btn');
        if (btn) btn.style.display = 'block';
      }, 3000);
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no">
      <div style="min-height: 100vh; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; padding: 20px; text-align: center;">
        <div style="width: 42px; height: 42px; border: 3px solid #1e293b; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px;">Telegram 矩阵极速自动化中台</div>
        <div style="font-size: 13px; color: #64748b; margin-bottom: 16px;">正在载入系统资源与防封引擎...</div>
        <div id="loading-fallback-btn" style="display: none; margin-top: 10px;">
          <button onclick="localStorage.removeItem('tg_wa_matrix_accounts_v2'); window.location.reload();" style="background: #10b981; color: #ffffff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
            🔄 刚刚更新了代码？点击一键刷新并载入最新版本
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
